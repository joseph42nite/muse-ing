<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muse-ing | The exhale</title>
<meta name="robots" content="noindex">
<style>
/* ============================================================= fonts */
@font-face{
  font-family:'Instrument Serif'; font-style:normal; font-weight:400; font-display:swap;
  src:url('/fonts/InstrumentSerif-Regular.ttf') format('truetype');
}

/* ============================================================= tokens */
:root{
  --ink:#050507;
  --bone:#e6e4de;
  --muted:#8a8a90;
  --line:rgba(230,228,222,.14);
  --vermilion:#e4262c;
  --pad:clamp(20px, 3.4vw, 56px);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--bone);overflow-x:hidden;overflow-x:clip}
body{
  font-family:system-ui,-apple-system,'Helvetica Neue',sans-serif;
  font-weight:400; font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ============================================================= layers */
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
/* the scroll the scene is scrubbed by */
.track{height:340vh;position:relative;z-index:1;pointer-events:none}
#gl.is-drag{cursor:grabbing}

.hud{
  position:fixed; left:var(--pad); top:var(--pad); z-index:2;
  display:flex; flex-direction:column; gap:14px; pointer-events:none;
}
.hud .logo{
  margin:0; font-family:Georgia,'Times New Roman',serif; font-weight:400;
  font-size:44px; line-height:1; letter-spacing:-.02em;
}
.hud .logo span{color:var(--vermilion)}
.hud p{margin:0;color:var(--muted);font-size:11px;letter-spacing:.18em;text-transform:uppercase}

.tag{
  position:fixed; left:var(--pad); bottom:calc(var(--pad) + 56px); z-index:2; max-width:340px;
  opacity:0; pointer-events:none;
}
.tag p{margin:0}
.tag .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--vermilion)}
.tag .h{margin-top:6px;font-size:22px;line-height:1.25;letter-spacing:-.01em}
.tag .b{margin-top:8px;font-size:13px;line-height:1.6;color:var(--muted)}

.cue{
  /* full-width so its fade can sit behind it; the scroll fades the whole thing */
  position:fixed; left:0; right:0; bottom:0; z-index:2; pointer-events:none;
  display:flex; justify-content:center; padding:18vh 0 var(--pad);
  background:linear-gradient(to bottom, rgba(5,5,7,0), rgba(5,5,7,.82) 70%);
}
.cue-in{
  display:flex; flex-direction:column; align-items:center; gap:14px;
  font-size:12px; letter-spacing:.28em; text-transform:uppercase; color:var(--bone);
  opacity:0; transform:translateY(12px);
}
.cue.is-in .cue-in{animation:cue-in 1s var(--ease) .5s forwards}
@keyframes cue-in{to{opacity:1;transform:none}}
.cue-in em{font-style:normal;color:var(--vermilion)}
/* a mouse with its wheel rolling down */
.cue .mouse{
  position:relative; width:26px; height:40px; border-radius:14px;
  border:1.5px solid rgba(230,228,222,.75);
}
.cue .mouse::after{
  content:''; position:absolute; left:50%; top:8px; width:3px; height:8px; margin-left:-1.5px;
  border-radius:2px; background:var(--vermilion); animation:wheel 1.6s var(--ease) infinite;
}
@keyframes wheel{0%{opacity:0;transform:translateY(-2px)}30%{opacity:1}100%{opacity:0;transform:translateY(13px)}}
/* touch: a chevron nudging up instead */
@media (hover:none){
  .cue .mouse{width:18px;height:18px;border:0;border-radius:0}
  .cue .mouse::after{
    top:4px; width:12px; height:12px; margin-left:-6px; border-radius:0; background:none;
    border-left:2px solid var(--vermilion); border-top:2px solid var(--vermilion);
    transform:rotate(45deg); animation:nudge 1.4s var(--ease) infinite;
  }
  @keyframes nudge{0%,100%{opacity:.4;transform:translateY(4px) rotate(45deg)}50%{opacity:1;transform:translateY(-3px) rotate(45deg)}}
}
@media (prefers-reduced-motion:reduce){
  .cue .mouse::after{animation:none;opacity:1}
  .cue.is-in .cue-in{animation:none;opacity:1;transform:none}
}

.ctl{
  position:fixed; right:var(--pad); bottom:var(--pad); z-index:2;
  display:flex; flex-wrap:wrap; gap:8px;
}
.ctl button{
  height:34px; padding:0 14px; border:1px solid var(--line); border-radius:999px;
  font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
  transition:color .2s var(--ease), border-color .2s var(--ease);
}
.ctl button:hover{color:var(--bone)}
/* small screens: the toggles move out of the cue's way */
@media (max-width:640px){ .ctl{top:var(--pad);bottom:auto} }
@media (hover:none){ .drag-hint{display:none} }
.ctl button[aria-pressed="true"]{color:var(--bone);border-color:var(--vermilion)}

#status{
  position:fixed; inset:0; z-index:3; display:flex; align-items:center; justify-content:center;
  font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--muted);
  background:var(--ink); transition:opacity .6s var(--ease);
}
#status.is-done{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="gl" aria-label="Interactive 3D study of the Muse-ing monkey's face"></canvas>

<div class="hud">
  <div class="logo" aria-hidden="true">m<span>-</span></div>
  <p>Scroll to exhale<span class="drag-hint"> · drag to turn</span></p>
</div>

<h1 class="sr-only">muse-ing</h1>
<div class="tag" id="tag">
  <p class="k">Hey, we're Muse-ing</p>
  <p class="h">A live music experience</p>
  <p class="b">Connecting independent artists with live venue crowds through real-time setlists, requests and dedications.</p>
</div>
<div class="cue" id="cue">
  <div class="cue-in">
    <span class="mouse" aria-hidden="true"></span>
    <span class="cue-text">Scroll to <em>exhale</em></span>
  </div>
</div>
<div class="track" aria-hidden="true"></div>

<div class="ctl" role="toolbar" aria-label="Display controls">
  <button type="button" data-toggle="fur" aria-pressed="true">Fur</button>
  <button type="button" data-toggle="post" aria-pressed="true">Film</button>
</div>

<div id="status">Sculpting…</div>

<script defer src="three.min.js"></script>
<script defer src="face.js"></script>
</body>
</html>
